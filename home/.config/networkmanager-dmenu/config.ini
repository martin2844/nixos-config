[dmenu]
dmenu_command = rofi -dmenu -i -no-sort -theme-str 'window {width: 760px;} listview {lines: 14;}'
active_chars = Connected:
highlight = True
compact = True
format = {name}  {sec}  {signal}%%
list_saved = False
prompt = Wi-Fi / Network

[dmenu_passphrase]
obscure = True

[editor]
terminal = ghostty
gui_if_available = True
gui = nm-connection-editor

[nmdm]
rescan_delay = 3
show_notifications = True
