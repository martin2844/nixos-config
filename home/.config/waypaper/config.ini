[Settings]
folder = ~/.nix-profile/share/wallpapers/curated
	~/Pictures/Wallpapers
backend = none
post_command = wallpaper-apply $wallpaper
use_xdg_state = True
number_of_columns = 4
fill = fill
sort = name
subfolders = True
all_subfolders = True
show_hidden = False
show_path_in_tooltip = False
zen_mode = True
language = en
color = #ffffff
show_gifs_only = False
swww_transition_type = any
swww_transition_step = 63
swww_transition_angle = 0
swww_transition_duration = 2
swww_transition_fps = 60
mpvpaper_sound = False
mpvpaper_options =
stylesheet = /home/martin/.config/waypaper/style.css
keybindings = ~/.config/waypaper/keybindings.ini
