name: immich-ediloco

x-storage: &storage
  type: bind
  bind:
    create_host_path: false

services:
  acceso-local:
    image: ghcr.io/immich-app/immich-server:v3.2.2
    # Node must receive stop signals as a child, rather than ignore them as PID 1.
    entrypoint: [tini, --, node, /access/acceso-local.mjs]
    restart: "no"
    user: "1000:100"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      UPSTREAM_URL: http://immich-server:2283
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - <<: *storage
        source: ./acceso-local.mjs
        target: /access/acceso-local.mjs
        read_only: true
    ports:
      - "127.0.0.1:2283:2283"
    depends_on:
      immich-server:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:2283/_local/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.2.2
    restart: "no"
    cpus: 3
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
      TZ: Europe/Madrid
    volumes:
      - <<: *storage
        source: ${DATA_ROOT}/library
        target: /data
      - <<: *storage
        source: /run/media/martin/Ediloco/Archivo-TheMartin
        target: /external/Archivo-TheMartin
        read_only: true
    ports:
      - "127.0.0.1:2284:2283"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Start models before workers, and keep them available until workers stop.
      immich-machine-learning:
        condition: service_healthy
    healthcheck:
      disable: false
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.2.2
    restart: "no"
    cpus: 4
    environment:
      MACHINE_LEARNING_MODEL_TTL: "300"
      MACHINE_LEARNING_REQUEST_THREADS: "2"
      MACHINE_LEARNING_MODEL_INTRA_OP_THREADS: "2"
      MACHINE_LEARNING_MODEL_INTER_OP_THREADS: "1"
    volumes:
      - <<: *storage
        source: ${DATA_ROOT}/model-cache
        target: /cache
    healthcheck:
      disable: false
  redis:
    image: valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    restart: "no"
    command: [valkey-server, --appendonly, "yes"]
    volumes:
      - <<: *storage
        source: ${DATA_ROOT}/redis
        target: /data
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10
  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    restart: "no"
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
      DB_STORAGE_TYPE: HDD
    volumes:
      - <<: *storage
        source: ${DATA_ROOT}/postgres
        target: /var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      disable: false
